
name: Build CHILELEKO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          if [ -f CHILELEKO-GITHUB-UPLOAD.zip ]; then
            unzip -o CHILELEKO-GITHUB-UPLOAD.zip -d android-project
          fi

      - name: Locate Gradle project
        run: |
          echo "Searching for Android Gradle project..."
          find . -name gradlew -type f
          find . -name build.gradle -o -name build.gradle.kts

      - name: Build debug APK
        run: |
          GRADLE_FILE=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle wrapper not found. Check uploaded project files."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHILELEKO-ANDROID-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
