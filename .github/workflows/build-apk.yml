name: Build CHILELEKO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip CHILELEKO-GITHUB-UPLOAD.zip -d android-project

      - name: Set up Android SDK
  uses: android-actions/setup-android@v4

- name: Accept Android SDK licenses
  run: yes | sdkmanager --licenses
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chileleko-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
