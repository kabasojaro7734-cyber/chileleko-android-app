
name: Build CHILELEKO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP files
        run: |
          mkdir -p extracted
          find . -maxdepth 1 -type f -iname '*.zip' -print -exec unzip -o {} -d extracted \;
          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100

      - name: Find Gradle wrapper
        run: |
          GRADLE_FILE=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No gradlew found. Android project files may be missing."
            exit 1
          fi
          echo "GRADLE_FILE=$GRADLE_FILE" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHILELEKO-ANDROID-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
