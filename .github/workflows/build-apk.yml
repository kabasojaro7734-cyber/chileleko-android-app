
name: Build CHILELEKO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Gradle wrapper
        run: |
          echo "Searching for gradlew..."
          find . -type f -name gradlew
          GRADLE_FILE=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: ZIP does not contain gradlew."
            exit 1
          fi
          echo "GRADLE_FILE=$GRADLE_FILE" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$(dirname "$GRADLE_FILE")"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHILELEKO-ANDROID-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
